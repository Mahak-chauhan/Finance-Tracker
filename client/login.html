<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FinanceTracker</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        :root {
            --color-primary: #7380ec;
            --color-background: #181a1e;
            --color-white: #202528;
            --color-dark: #edeffd;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--color-background);
            color: var(--color-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .auth-card {
            background: var(--color-white);
            padding: 3rem;
            border-radius: 2rem;
            box-shadow: 0 2rem 3rem rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }

        .logo span {
            font-size: 2.5rem;
            color: #ff7782;
        }

        .logo h2 {
            font-size: 1.8rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            background: #181a1e;
            border: 1px solid #7d8da1;
            color: white;
            border-radius: 0.5rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            margin-top: 1rem;
        }

        button:hover {
            opacity: 0.8;
        }

        .toggle-text {
            margin-top: 1rem;
            font-size: 0.8rem;
            cursor: pointer;
            color: #7380ec;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div class="logo">
            <span class="material-icons-sharp">account_balance_wallet</span>
            <h2>Fi<span style="color:#ff7782">nance</span></h2>
        </div>

        <form id="auth-form">
            <h2 id="form-title">Welcome Back</h2>
            <div id="name-field" style="display: none;">
                <input type="text" id="username" placeholder="Full Name">
            </div>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="submit-btn">Login</button>
            <p class="toggle-text" onclick="toggleMode()">New here? Create an account</p>
        </form>
    </div>
<script>
    let isLogin = true;

    const API_URL = "http://localhost:5000/api/auth";

    // Check if already logged in
    if (localStorage.getItem("token")) {
        window.location.href = "dashboard.html";
    }

    function toggleMode() {
        isLogin = !isLogin;

        const title = document.getElementById("form-title");
        const nameField = document.getElementById("name-field");
        const btn = document.getElementById("submit-btn");
        const toggle = document.querySelector(".toggle-text");

        if (isLogin) {
            title.innerText = "Welcome Back";
            nameField.style.display = "none";
            btn.innerText = "Login";
            toggle.innerText = "New here? Create an account";
        } else {
            title.innerText = "Create Account";
            nameField.style.display = "block";
            btn.innerText = "Sign Up";
            toggle.innerText = "Already have an account? Login";
        }
    }

    document.getElementById("auth-form").addEventListener("submit", async (e) => {

        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const username = document.getElementById("username").value;

        try {

            if (isLogin) {

                const response = await fetch(`${API_URL}/login`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })

                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.message);
                    return;
                }

                localStorage.setItem("token", data.token);
                localStorage.setItem("user", JSON.stringify(data.user));

                alert("Login Successful!");

                window.location.href = "dashboard.html";

            } else {

                const response = await fetch(`${API_URL}/register`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: username,
                        email,
                        password
                    })

                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.message);
                    return;
                }

                alert("Registration Successful! Please Login.");

                toggleMode();

                document.getElementById("auth-form").reset();

            }

        } catch (error) {

            console.log(error);

            alert("Server Error");

        }

    });

</script>
    </body>

</html>
